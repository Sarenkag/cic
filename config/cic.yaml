# Konfiguracja CIC. Puste pola uzupełnij, gdy zapadną decyzje (nazwa, region, dyrektorzy).
cic:
  name: ""               # nazwa CIC, np. "Example Access CIC"
  region: ""             # np. "England / Greater Manchester"
  timezone: Europe/London

company:
  number: ""             # numer w Companies House (po rejestracji)
  incorporation_date: "" # RRRR-MM-DD, data rejestracji
  trading_start: ""      # RRRR-MM-DD, rozpoczęcie działalności (domyślnie data rejestracji)
  accounting_reference_date: ""  # MM-DD, tylko jeśli zmieniono rok obrotowy
  last_confirmation_date: ""     # RRRR-MM-DD, data ostatniego confirmation statement

ico:
  registration_date: ""  # RRRR-MM-DD, data rejestracji w ICO

# Dyrektorzy: login do panelu -> dane. Hasła są w pliku .env (CIC_USERS), nie tutaj.
directors:
  grzegorz:
    name: Grzegorz
    email: ""
    independent: false
    safeguarding_lead: false

approvals:
  single_director_limit_gbp: 250   # do tej kwoty wystarczy jeden dyrektor (poziom 2)
  grant_application_limit_gbp: 10000

warnings_days: [60, 30, 14, 7]

schedule:
  lad: "07:30"
  straznik: "07:45"
  koordynator: "08:00"

llm:
  model: claude-opus-5-5
  effort: low
